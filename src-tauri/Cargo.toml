[package]
name = "klar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Klar — messy speech in, finished text out."

[lib]
# Tauri v2 keeps the app in a lib so the mobile entry point can call it; the
# desktop binary below is a two-line shim.
name = "klar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "klar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
klar-core.workspace = true
klar-platform.workspace = true

tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
directories.workspace = true
parking_lot.workspace = true
