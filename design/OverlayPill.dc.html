<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-8e3f2e58-9960-48cc-8001-18ab32255873/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>
<div style="display:inline-flex; align-items:center; height:64px; box-sizing:border-box; font-family:var(--font-body); -webkit-font-smoothing:antialiased; border-radius:var(--radius-md); overflow:hidden; position:relative; padding:0 var(--space-4); gap:var(--space-3); transition:width 300ms cubic-bezier(0.2,0.8,0.2,1); width:{{ w }}px; background:{{ shellBg }}; border:2px solid {{ shellEdge }}; box-shadow:{{ shellShadow }};">

  <sc-if value="{{ isCollapse }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; align-items:center; flex-shrink:0;">
      <sc-if value="{{ showBars }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex; align-items:center; gap:2px; height:30px; width:84px;">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="12">
            <div style="flex-shrink:0; border-radius:var(--radius-sm); transition:height 130ms linear, width 300ms cubic-bezier(0.2,0.8,0.2,1), background-color 300ms linear, opacity 300ms linear; width:{{ b.w }}px; height:{{ b.h }}px; background:{{ b.c }}; opacity:{{ b.o }};"></div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ showMark }}" hint-placeholder-val="{{ false }}">
        <div style="width:22px; height:22px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; line-height:1; background:{{ markBg }}; color:{{ markInk }};">{{ markGlyph }}</div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ isFocus }}" hint-placeholder-val="{{ false }}">
    <div style="width:14px; flex-shrink:0; display:flex; flex-direction:column; align-items:stretch; gap:2px;">
      <div style="height:2px; transition:background-color 300ms linear; background:{{ dotColor }};"></div>
      <div style="transition:height 130ms linear, background-color 300ms linear; height:{{ dotSize }}px; background:{{ dotColor }};"></div>
      <div style="height:2px; transition:background-color 300ms linear; background:{{ dotColor }};"></div>
    </div>
  </sc-if>

  <sc-if value="{{ isScan }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative; flex:1; height:30px; overflow:hidden;">
      <div style="position:absolute; inset:0; display:flex; align-items:center; gap:2px; transition:opacity 300ms linear; opacity:{{ scanBarsOpacity }};">
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="34">
          <div style="width:2px; flex-shrink:0; transition:height 130ms linear, background-color 300ms linear; height:{{ b.h }}px; background:{{ b.c }}; opacity:{{ b.o }};"></div>
        </sc-for>
      </div>
      <div style="position:absolute; inset:0; display:flex; align-items:center; transition:clip-path 300ms cubic-bezier(0.2,0.8,0.2,1); clip-path:{{ scanClip }};">
        <div style="font-size:13.5px; font-weight:500; line-height:1.3; color:{{ inkColor }}; white-space:nowrap;">{{ scanText }}</div>
      </div>
      <div style="position:absolute; top:0; bottom:0; width:2px; transition:left 300ms cubic-bezier(0.2,0.8,0.2,1), opacity 200ms linear; left:{{ scanLine }}; opacity:{{ scanLineOpacity }}; background:{{ accent }};"></div>
    </div>
  </sc-if>

  <sc-if value="{{ showStatus }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; flex-direction:column; gap:var(--space-1); flex:1; min-width:0;">
      <div style="font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; white-space:nowrap; transition:color 300ms linear; color:{{ statusColor }};">{{ statusWord }}</div>
      <div style="font-size:10.5px; font-weight:500; letter-spacing:0.05em; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:{{ metaColor }};">{{ metaText }}</div>
    </div>
  </sc-if>

  <sc-if value="{{ showFocusText }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;">
      <div style="font-size:13.5px; font-weight:500; line-height:1.3; transition:filter 320ms cubic-bezier(0.2,0.8,0.2,1), opacity 320ms linear; filter:blur({{ blurPx }}px); opacity:{{ textOpacity }}; color:{{ inkColor }};">{{ focusText }}</div>
      <sc-if value="{{ showFocusMeta }}" hint-placeholder-val="{{ true }}">
        <div style="font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; white-space:nowrap; color:{{ statusColor }};">{{ statusWord }}</div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ showBody }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;">
      <div style="font-size:13px; font-weight:600; line-height:1.3; color:{{ inkColor }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ bodyTitle }}</div>
      <div style="font-size:10.5px; font-weight:500; letter-spacing:0.05em; text-transform:uppercase; color:{{ metaColor }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ bodySub }}</div>
    </div>
  </sc-if>

  <div style="position:absolute; left:0; right:0; bottom:0; height:2px; transition:transform 300ms linear, opacity 300ms linear; transform-origin:left center; transform:scaleX({{ progress }}); opacity:{{ progressOpacity }}; background:{{ accent }};"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:140},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;collapse&quot;,&quot;focus&quot;,&quot;scan&quot;],&quot;default&quot;:&quot;collapse&quot;,&quot;tsType&quot;:&quot;'collapse'|'focus'|'scan'&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;listening&quot;,&quot;thinking&quot;,&quot;polishing&quot;,&quot;done&quot;,&quot;error&quot;],&quot;default&quot;:&quot;listening&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const RAW = "so I think we should um ship on Tuesday — no, Friday and tell the team";
const FINAL = "Ship on Friday. Tell the team.";
const SEQ = [["listening", 3000], ["thinking", 1100], ["polishing", 1400], ["done", 1900]];

class Component extends DCLogic {
  state = { tick: 0, idx: 0, elapsed: 0 };

  componentDidMount() {
    if (!this.props.autoplay) return;
    this.timer = setInterval(() => {
      this.setState(s => {
        let elapsed = s.elapsed + 130, idx = s.idx;
        if (elapsed > SEQ[idx][1]) { elapsed = 0; idx = (idx + 1) % SEQ.length; }
        return { tick: s.tick + 1, elapsed, idx };
      });
    }, 130);
  }
  componentWillUnmount() { clearInterval(this.timer); }

  level(i) {
    const t = this.state.tick * 0.42;
    return 0.12 + 0.88 * Math.abs(Math.sin(t + i * 0.79) * 0.6 + Math.sin(t * 1.7 + i * 0.31) * 0.4);
  }

  renderVals() {
    const variant = this.props.variant || "collapse";
    const dark = (this.props.theme || "dark") === "dark";
    const st = this.props.autoplay ? SEQ[this.state.idx][0] : (this.props.state || "listening");
    const tick = this.state.tick;
    const frac = this.props.autoplay ? this.state.elapsed / SEQ[this.state.idx][1] : 0.55;

    const accent = dark ? "var(--color-accent-500)" : "var(--color-accent)";
    const ink = dark ? "var(--color-neutral-100)" : "var(--color-text)";
    const meta = dark ? "var(--color-neutral-400)" : "var(--color-neutral-600)";
    const barIdle = dark ? "var(--color-neutral-600)" : "var(--color-neutral-400)";

    const shellBg = dark ? "color-mix(in srgb, #201e1d 94%, transparent)" : "color-mix(in srgb, #f8f4f4 96%, transparent)";
    const shellEdge = dark ? "var(--color-neutral-100)" : "var(--color-text)";
    const shellShadow = dark
      ? "0 0 0 1px color-mix(in srgb, #201e1d 60%, transparent), var(--shadow-lg)"
      : "var(--shadow-lg)";

    const isCollapse = variant === "collapse", isFocus = variant === "focus", isScan = variant === "scan";
    const wordW = [17, 10, 23, 12, 8, 19, 13];

    const bars = [];
    if (isCollapse) {
      for (let i = 0; i < 12; i++) {
        if (st === "listening") bars.push({ w: 3, h: Math.round(4 + this.level(i) * 26), c: accent, o: 1 });
        else if (st === "thinking") bars.push({ w: 3, h: 2, c: (Math.floor(tick) % 12) === i ? accent : barIdle, o: 1 });
        else if (st === "polishing") bars.push({ w: Math.round(wordW[i % 7] * 0.42), h: 4, c: barIdle, o: i > 7 ? 0 : 1 });
        else bars.push({ w: 3, h: 2, c: barIdle, o: 0 });
      }
    } else if (isScan) {
      for (let i = 0; i < 34; i++) {
        const lv = this.level(i);
        if (st === "listening") bars.push({ h: Math.round(2 + lv * 28), c: accent, o: 1 });
        else if (st === "thinking") bars.push({ h: Math.round(2 + lv * 10), c: barIdle, o: 1 });
        else bars.push({ h: 2, c: barIdle, o: 0.7 });
      }
    }

    const statusWord = { listening: "Listening", thinking: "Thinking", polishing: "Polishing", done: "Inserted", error: "No microphone" }[st];
    const metaText = {
      listening: "0:04 — HOLD ⌥ SPACE",
      thinking: "ON THIS MAC",
      polishing: "REMOVING FILLER",
      done: "LINEAR",
      error: "CHECK INPUT DEVICE"
    }[st];

    let w = 260;
    if (st === "polishing") w = isCollapse ? 300 : 356;
    if (st === "done") w = isCollapse ? 316 : 356;
    if (st === "error") w = 340;

    return {
      w, shellBg, shellEdge, shellShadow, accent, inkColor: ink, metaColor: meta, bars,
      isCollapse, isFocus, isScan,
      showBars: isCollapse && st !== "done" && st !== "error",
      showMark: isCollapse && (st === "done" || st === "error"),
      markBg: accent,
      markInk: "var(--color-neutral-100)",
      markGlyph: st === "error" ? "!" : "✓",
      showStatus: (isCollapse && st !== "done") || (isScan && (st === "listening" || st === "error")) || st === "error",
      showBody: isCollapse && st === "done",
      bodyTitle: FINAL,
      bodySub: "29 characters — Linear",
      statusWord, metaText,
      statusColor: st === "listening" || st === "error" ? accent : st === "done" ? ink : meta,
      showFocusText: isFocus && st !== "error",
      showFocusMeta: isFocus && st !== "done",
      focusText: st === "listening" || st === "thinking" ? RAW : FINAL,
      blurPx: { listening: 7, thinking: 4, polishing: 1.4, done: 0, error: 0 }[st],
      textOpacity: st === "listening" ? 0.55 : st === "thinking" ? 0.75 : 1,
      dotColor: st === "listening" || st === "error" ? accent : st === "done" ? ink : barIdle,
      dotSize: st === "listening" ? Math.round(6 + this.level(0) * 16) : st === "done" ? 22 : 8,
      scanBarsOpacity: st === "listening" ? 1 : st === "thinking" ? 0.7 : 0,
      scanClip: st === "listening" ? "inset(0 100% 0 0)" : st === "thinking" ? "inset(0 62% 0 0)" : st === "polishing" ? "inset(0 22% 0 0)" : "inset(0 0 0 0)",
      scanText: st === "polishing" || st === "done" ? FINAL : "Ship on Tuesday — no, Friday",
      scanLine: st === "listening" ? "0%" : st === "thinking" ? "38%" : st === "polishing" ? "78%" : "100%",
      scanLineOpacity: st === "thinking" || st === "polishing" ? 1 : 0,
      progress: st === "thinking" ? 0.25 + frac * 0.35 : st === "polishing" ? 0.6 + frac * 0.4 : st === "listening" ? 0 : 1,
      progressOpacity: st === "thinking" || st === "polishing" ? 1 : 0
    };
  }
}
</script>
</body>
</html>
