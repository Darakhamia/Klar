name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback on everything that does not need a desktop toolchain: the
  # pipeline crates, the CLI harness, and the frontend.
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # cpal needs ALSA headers. Linux is not a target, but the pipeline crates
      # build and test here so they can be developed off a target machine.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev

      - run: cargo fmt --all --check

      - run: cargo clippy -p klar-core -p klar-platform -p klar-cli --all-targets -- -D warnings

      - run: cargo test -p klar-core -p klar-platform -p klar-cli

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

  # The portable GPU backend — AMD, Intel and NVIDIA alike, and the only answer
  # for a machine without CUDA. It is here for the same reason macOS is in the
  # desktop matrix: the `vulkan` feature was declared at M1 and had never once
  # been compiled by the time it was needed, which is how a build option rots.
  #
  # Linux is not a target. This job is not claiming otherwise — it compiles the
  # shaders and the backend, which is what actually breaks, and it costs a
  # fraction of a Windows runner. Latency is measured on real hardware, never
  # here.
  vulkan:
    name: Vulkan backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # glslc compiles whisper.cpp's shaders at build time; libvulkan-dev is the
      # loader it links against. No GPU is needed to build either.
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libvulkan-dev glslc

      - run: cargo clippy -p klar-core --features vulkan --all-targets -- -D warnings

      # The device probe runs against a real ggml registry — on a runner with no
      # GPU, which is exactly the case it has to describe honestly.
      - run: cargo test -p klar-core --features vulkan

  # The real thing. Windows ships first; macOS is in the matrix from the start
  # so its backend cannot silently rot while Windows is being built out.
  desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      - run: cargo build --workspace
