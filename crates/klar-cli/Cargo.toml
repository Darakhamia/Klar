[package]
name = "klar-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless harness for the Klar pipeline."

[features]
default = []
# Forwarded to klar-core so `cargo run -p klar-cli --features cuda` builds the
# GPU path without the workspace having to name whisper-rs itself.
cuda = ["klar-core/cuda"]
vulkan = ["klar-core/vulkan"]
metal = ["klar-core/metal"]
coreml = ["klar-core/coreml"]

[[bin]]
name = "klar-cli"
path = "src/main.rs"

[dependencies]
klar-core.workspace = true
klar-platform.workspace = true
anyhow.workspace = true
clap = { version = "4.6.5", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
