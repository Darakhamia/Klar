[package]
name = "klar-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Klar dictation pipeline — no Tauri, no UI."

[features]
default = []

# GPU backends for whisper.cpp. None is on by default: CI has no CUDA toolkit,
# and a build that silently falls back to CPU is the failure mode M1 exists to
# rule out. Pick one explicitly for a local build.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]
coreml = ["whisper-rs/coreml"]

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

cpal = "0.18.1"
rubato = "4.0.0"
# raw-api: for whisper_print_system_info, the one honest answer about what
# accelerators this binary actually carries.
whisper-rs = { version = "0.16.0", features = ["tracing_backend", "raw-api"] }
hound = "3.5.1"

reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "stream",
    "http2",
    "json",
] }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
sha2 = "0.11.0"
hex = "0.4.3"
directories.workspace = true
# Held at 0.37 rather than 0.40: the newer releases pull libsqlite3-sys 0.38,
# whose build script uses `cfg_select!`, still unstable on Rust 1.94. `bundled`
# compiles SQLite from source, so there is no system library to install and no
# version of it to be wrong on somebody's machine.
rusqlite = { version = "0.37", features = ["bundled"] }

# Not used directly — these exist to constrain cpal.
#
# cpal 0.18.1 declares `windows` and `windows-core` as two independent
# `>=0.61, <=0.62` ranges. Either pair works; the mix does not. Cargo is free to
# resolve `windows 0.61.3` (which carries windows-core 0.61.2) alongside a
# separate `windows-core 0.62.2`, which puts two `windows_core` crates in one
# graph and makes cpal's own `#[implement]` macro fail to compile with a wall of
# "multiple different versions of crate windows_core".
#
# Naming both here forces them to the same major, so the resolver cannot roll
# the broken combination again. Drop this block once cpal ships a manifest that
# keeps the two in step.
[target.'cfg(target_os = "windows")'.dependencies]
windows = "0.62"
windows-core = "0.62"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
